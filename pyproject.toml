[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-rag-fde"
version = "0.1.0"
description = "Auditable CSV-to-SQLite RAG with offline hallucination evaluation and optional Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT for project code only; original dataset license not granted"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
