<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="295" viewBox="0 0 1040 295" role="img" aria-labelledby="title desc">
<title id="title">RAG pipeline architecture</title>
<desc id="desc">CSV data goes through schema validation, SQLite retrieval, guarded answer generation, and evaluation with source references.</desc>
<rect width="1040" height="295" rx="16" fill="#0b1221"/>
<text x="36" y="39" fill="#cfe8ef" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Evidence-first RAG pipeline</text>
<text x="36" y="60" fill="#92aabd" font-family="Arial,sans-serif" font-size="12">Offline default · optional local LLM · measurable source checks</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="30" y="100" rx="12" width="169" height="96" fill="#172b40" stroke="#4b7183"/>
<text x="114" y="130" fill="#82dfd3" font-size="15" font-weight="bold">Four CSV files</text><text x="114" y="152" fill="#c3d6e7" font-size="11">skills · industries</text><text x="114" y="170" fill="#c3d6e7" font-size="11">benefits · salaries</text>
<rect x="234" y="100" rx="12" width="169" height="96" fill="#172b40" stroke="#4b7183"/>
<text x="318" y="130" fill="#82dfd3" font-size="15" font-weight="bold">Validate + join</text><text x="318" y="152" fill="#c3d6e7" font-size="11">job_id links rows</text><text x="318" y="170" fill="#c3d6e7" font-size="11">file:row provenance</text>
<rect x="438" y="100" rx="12" width="169" height="96" fill="#172b40" stroke="#4b7183"/>
<text x="522" y="130" fill="#82dfd3" font-size="15" font-weight="bold">SQLite + FTS5</text><text x="522" y="152" fill="#c3d6e7" font-size="11">exact job lookup</text><text x="522" y="170" fill="#c3d6e7" font-size="11">BM25 ranked search</text>
<rect x="642" y="100" rx="12" width="169" height="96" fill="#172b40" stroke="#4b7183"/>
<text x="726" y="130" fill="#82dfd3" font-size="15" font-weight="bold">Guarded answer</text><text x="726" y="152" fill="#c3d6e7" font-size="11">verify field + value</text><text x="726" y="170" fill="#c3d6e7" font-size="11">cite or abstain</text>
<rect x="846" y="100" rx="12" width="165" height="96" fill="#172b40" stroke="#4b7183"/>
<text x="928" y="130" fill="#82dfd3" font-size="15" font-weight="bold">Evaluation</text><text x="928" y="152" fill="#c3d6e7" font-size="11">unsupported claims</text><text x="928" y="170" fill="#c3d6e7" font-size="11">coverage · refusals</text>
<g fill="#80d9cc"><path d="M204 142 h23 l-7 -7 v5 h-16z"/><path d="M408 142 h23 l-7 -7 v5 h-16z"/><path d="M612 142 h23 l-7 -7 v5 h-16z"/><path d="M816 142 h23 l-7 -7 v5 h-16z"/></g>
</g>
<text x="36" y="248" fill="#a5bdd0" font-family="Arial,sans-serif" font-size="13">Optional: Ollama selects field/value claims → exact source whitelist → safe rendered output</text>
<text x="36" y="269" fill="#7f98ab" font-family="Arial,sans-serif" font-size="12">The benchmark checks structured claims. Free-text LLM hallucinations require separate reviewed labels.</text>
</svg>
